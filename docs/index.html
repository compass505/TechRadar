<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechRadar 505</title>
    <link rel="stylesheet" href="styles.css?v=personalized-mvp-8" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <button id="brand-home" class="brand-home" type="button" aria-label="TOPへ移動">
          <span class="brand-mark">TechRadar 505</span>
        </button>

        <nav id="primary-nav" class="nav" aria-label="主要ナビゲーション"></nav>

        <div class="header-tools">
          <div class="edition-picker" aria-label="表示日">
            <button id="edition-all" class="edition-all-button" type="button">すべて</button>
            <label>
              <span>表示日</span>
              <input id="edition-date" type="date" />
            </label>
          </div>
        </div>

        <div class="mobile-header-actions" aria-label="スマホ操作">
          <button id="mobile-search" class="mobile-icon-button" type="button" aria-label="検索">
            検索
          </button>
          <button id="mobile-favorites" class="mobile-icon-button" type="button" aria-label="お気に入り">
            ★
          </button>
          <button
            id="mobile-menu-toggle"
            class="mobile-menu-toggle"
            type="button"
            aria-label="メニュー"
            aria-expanded="false"
            aria-controls="mobile-menu"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>

        <div id="header-dropdown" class="header-dropdown" hidden></div>
        <div id="mobile-menu" class="mobile-menu" hidden></div>
      </header>

      <main class="content">
        <header class="page-header">
          <div>
            <p id="eyebrow" class="eyebrow"></p>
            <h1 id="page-title"></h1>
          </div>
          <p id="page-meta" class="page-meta"></p>
        </header>

        <section id="page-content"></section>
      </main>
    </div>

    <template id="story-card-template">
      <article class="story-card">
        <div class="story-topline">
          <div class="badges"></div>
          <button class="favorite-button" type="button" aria-label="お気に入りに追加">☆</button>
        </div>
        <h3></h3>
        <p class="story-summary"></p>
        <div class="story-footer">
          <div class="story-meta"></div>
          <a class="source-button" target="_blank" rel="noreferrer">元記事を開く</a>
        </div>
      </article>
    </template>

    <script type="module" src="app.js?v=personalized-mvp-8"></script>
  </body>
</html>
