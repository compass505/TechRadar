name: Update Tech Radar 505

on:
  schedule:
    # 00:23-05:23 JST every day. GitHub Actions cron uses UTC.
    - cron: "23 15-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tech-radar-505
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5-mini

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh default branch
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch, score, and build site
        run: python scripts/update_news.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Tech Radar 505"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
